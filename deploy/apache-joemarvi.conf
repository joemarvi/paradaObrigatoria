<VirtualHost *:80>
    ServerName joemarvi.com.br
    ServerAlias www.joemarvi.com.br
    DocumentRoot /var/www/parada-obrigatoria/current
    <Directory /var/www/parada-obrigatoria>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !\.[^/]+$
        RewriteRule ^ /index.html [END]
        <FilesMatch "^(?:_headers|_redirects)$">
            Require all denied
        </FilesMatch>
        <Files "index.html">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </Files>
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    ErrorLog ${APACHE_LOG_DIR}/parada-obrigatoria-error.log
    CustomLog ${APACHE_LOG_DIR}/parada-obrigatoria-access.log combined
</VirtualHost>
